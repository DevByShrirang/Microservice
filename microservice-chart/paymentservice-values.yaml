name: paymentservice
image:
  repository: adijaiswal/paymentservice
  tag: latest
containerPort: 50051
env:
  - name: PORT
    value: "50051"
  - name: DISABLE_PROFILER
    value: "1"
readinessProbe:
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:50051"]
livenessProbe:
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:50051"]
services:
  - name: paymentservice
    type: ClusterIP
    portName: grpc
    port: 50051
    targetPort: 50051
