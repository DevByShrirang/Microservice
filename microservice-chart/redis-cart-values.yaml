name: redis-cart
image:
  repository: redis
  tag: alpine
containerName: redis
containerPort: 6379

readinessProbe:
  periodSeconds: 5
  tcpSocket:
    port: 6379
livenessProbe:
  periodSeconds: 5
  tcpSocket:
    port: 6379

resources:
  limits:
    memory: 256Mi
    cpu: 125m
  requests:
    cpu: 70m
    memory: 200Mi

volumes:
  - name: redis-data
    emptyDir: {}

volumeMounts:
  - mountPath: /data
    name: redis-data

services:
  - name: redis-cart
    type: ClusterIP
    portName: tcp-redis
    port: 6379
    targetPort: 6379
