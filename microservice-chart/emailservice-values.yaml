name: emailservice
image:
  repository: adijaiswal/emailservice
  tag: latest
containerPort: 8080

podSecurityContext:
  fsGroup: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

env:
  - name: PORT
    value: "8080"
  - name: DISABLE_PROFILER
    value: "1"

readinessProbe:
  periodSeconds: 5
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:8080"]
livenessProbe:
  periodSeconds: 5
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:8080"]

services:
  - name: emailservice
    type: ClusterIP
    portName: grpc
    port: 5000
    targetPort: 8080
