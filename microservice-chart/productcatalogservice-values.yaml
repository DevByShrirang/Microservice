name: productcatalogservice
image:
  repository: adijaiswal/productcatalogservice
  tag: latest
containerPort: 3550
env:
  - name: PORT
    value: "3550"
  - name: DISABLE_PROFILER
    value: "1"
readinessProbe:
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:3550"]
livenessProbe:
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:3550"]
services:
  - name: productcatalogservice
    type: ClusterIP
    portName: grpc
    port: 3550
    targetPort: 3550
