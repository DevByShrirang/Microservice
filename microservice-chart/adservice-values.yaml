name: adservice
image:
  repository: shrirang451/adservice
  tag: latest
containerPort: 9555
env:
  - name: PORT
    value: "9555"
readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 15
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:9555"]
livenessProbe:
  initialDelaySeconds: 20
  periodSeconds: 15
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:9555"]
resources:
  requests:
    cpu: 200m
    memory: 180Mi
  limits:
    cpu: 300m
    memory: 300Mi
services:
  - name: adservice
    type: ClusterIP
    portName: grpc
    port: 9555
    targetPort: 9555
