name: currencyservice
image:
  repository: adijaiswal/currencyservice
  tag: latest
containerPort: 7000
env:
  - name: PORT
    value: "7000"
  - name: DISABLE_PROFILER
    value: "1"
readinessProbe:
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:7000"]
livenessProbe:
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:7000"]
services:
  - name: currencyservice
    type: ClusterIP
    portName: grpc
    port: 7000
    targetPort: 7000
